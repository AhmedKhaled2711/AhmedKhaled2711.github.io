<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <!-- Background Studio Canvas -->
    <linearGradient id="studioBg" x1="0" y1="0" x2="1200" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F9FBFA"/>
      <stop offset="100%" stop-color="#EDF2F0"/>
    </linearGradient>

    <!-- Phone Glass Surface -->
    <linearGradient id="phoneScreenBg" x1="0" y1="0" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAF9"/>
    </linearGradient>

    <!-- Logo Background Gradient (#EAF2F1 -> #F5F8F7) -->
    <linearGradient id="splashLogoCanvas" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EAF2F1"/>
      <stop offset="100%" stop-color="#F5F8F7"/>
    </linearGradient>

    <!-- Dynamic Courier Wings Gradient (#F16B5A -> #F05C4C) -->
    <linearGradient id="wingsGrad" x1="110" y1="212" x2="375" y2="309" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F16B5A"/>
      <stop offset="100%" stop-color="#F05C4C"/>
    </linearGradient>

    <!-- Shadow Filters -->
    <filter id="phoneShadow" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#102F34" flood-opacity="0.14"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#102F34" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Studio Canvas -->
  <rect width="1200" height="680" rx="20" fill="url(#studioBg)" stroke="#DDE5E3" stroke-width="1.5"/>

  <!-- ==================== LEFT: SMARTPHONE MOCKUP ==================== -->
  <g transform="translate(100, 40)" filter="url(#phoneShadow)">
    <!-- Phone Bezel / Frame -->
    <rect width="320" height="600" rx="42" fill="#181A1C" stroke="#2D3238" stroke-width="3"/>
    
    <!-- Phone Screen (1080x2400 aspect ratio equivalent) -->
    <rect x="10" y="10" width="300" height="580" rx="34" fill="url(#phoneScreenBg)"/>

    <!-- Punch-Hole Camera -->
    <circle cx="160" cy="24" r="5" fill="#0C0D0E"/>

    <!-- Status Bar (9:41, WiFi, Signal, Battery) -->
    <text x="35" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#102F34">9:41</text>
    <circle cx="270" cy="24" r="3" fill="#102F34"/>
    <rect x="278" y="20" width="12" height="7" rx="2" fill="none" stroke="#102F34" stroke-width="1.2"/>
    <rect x="280" y="22" width="7" height="3" rx="1" fill="#102F34"/>

    <!-- SPLASH SCREEN CONTENT (Matching SplashScreen.kt) -->
    <!-- 152dp Circular Surface for ic_hatli_logo -->
    <g transform="translate(75, 160)">
      <circle cx="75" cy="75" r="75" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <circle cx="75" cy="75" r="70" fill="url(#splashLogoCanvas)" stroke="#E1ECE9" stroke-width="1.5"/>
      
      <!-- Scaled Vector Emblem -->
      <g transform="translate(13, 13) scale(0.24)">
        <!-- Top H Crown -->
        <path d="M201,145h17c8,0 15,7 15,15v38h46v-38c0,-8 7,-15 15,-15h17c8,0 15,7 15,15v47H186v-47c0,-8 7,-15 15,-15z" fill="#102F34"/>
        <!-- Bottom H Foundation -->
        <path d="M186,251h140v70c0,9 -7,16 -16,16h-15c-9,0 -16,-7 -16,-16v-38l-24,-19 -23,19v38c0,9 -7,16 -16,16h-14c-9,0 -16,-7 -16,-16v-70z" fill="#102F34"/>
        <!-- Dynamic Courier Wings -->
        <path d="M110,212C159,212 210,212 253,212L344,212L369,229L375,229L372,241C371,244 369,245 366,245L286,245C239,245 205,260 188,286C183,294 180,302 179,309C174,282 187,258 211,242C229,230 253,223 281,223L339,223L329,219L253,219C206,219 155,219 121,218Z" fill="url(#wingsGrad)"/>
        <path d="M110,225C143,226 173,226 205,226L224,226C209,230 199,234 190,239C164,238 142,235 121,231Z" fill="url(#wingsGrad)"/>
        <path d="M132,240C155,241 176,241 195,241C188,245 183,248 179,252C163,250 148,247 132,244Z" fill="url(#wingsGrad)"/>
        <path d="M147,254C160,255 171,255 182,255L177,261C166,259 157,257 147,254Z" fill="url(#wingsGrad)"/>
        <!-- Accent Detail -->
        <path d="M329,219h17l8,8h-25z" fill="#EAF2F1"/>
      </g>
    </g>

    <!-- Typography: Title & Tagline -->
    <text x="150" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#F16B5A">Hatli</text>
    <text x="150" y="395" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#526467">كل اللي تحتاجه، من مكانك</text>

    <!-- Circular Progress Indicator -->
    <circle cx="150" cy="525" r="13" fill="none" stroke="#FFEFEA" stroke-width="2.5"/>
    <path d="M 150,512 A 13 13 0 0 1 163,525" fill="none" stroke="#F16B5A" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Home Indicator / Navigation Bar -->
    <rect x="105" y="575" width="90" height="3" rx="1.5" fill="#A8B4B2"/>
  </g>

  <!-- ==================== RIGHT: BRANDING & SYSTEM SHOWCASE ==================== -->
  <g transform="translate(480, 50)">
    <!-- Header -->
    <text x="0" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#F16B5A">NATIVE ANDROID SHOWCASE</text>
    <text x="0" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#102F34">Hatli Hyperlocal Delivery</text>
    <text x="0" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#526467">Production Android application designed for emerging and non-geocoded communities.</text>

    <!-- App Icon Card -->
    <g transform="translate(0, 130)" filter="url(#cardShadow)">
      <rect width="640" height="150" rx="18" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1"/>
      
      <!-- Adaptive Squircle App Icon -->
      <g transform="translate(25, 20)">
        <rect width="110" height="110" rx="26" fill="url(#splashLogoCanvas)" stroke="#D8E4E1" stroke-width="1.5"/>
        <g transform="translate(3, 3) scale(0.20)">
          <!-- Top H -->
          <path d="M201,145h17c8,0 15,7 15,15v38h46v-38c0,-8 7,-15 15,-15h17c8,0 15,7 15,15v47H186v-47c0,-8 7,-15 15,-15z" fill="#102F34"/>
          <!-- Bottom H -->
          <path d="M186,251h140v70c0,9 -7,16 -16,16h-15c-9,0 -16,-7 -16,-16v-38l-24,-19 -23,19v38c0,9 -7,16 -16,16h-14c-9,0 -16,-7 -16,-16v-70z" fill="#102F34"/>
          <!-- Wings -->
          <path d="M110,212C159,212 210,212 253,212L344,212L369,229L375,229L372,241C371,244 369,245 366,245L286,245C239,245 205,260 188,286C183,294 180,302 179,309C174,282 187,258 211,242C229,230 253,223 281,223L339,223L329,219L253,219C206,219 155,219 121,218Z" fill="url(#wingsGrad)"/>
          <path d="M110,225C143,226 173,226 205,226L224,226C209,230 199,234 190,239C164,238 142,235 121,231Z" fill="url(#wingsGrad)"/>
          <path d="M132,240C155,241 176,241 195,241C188,245 183,248 179,252C163,250 148,247 132,244Z" fill="url(#wingsGrad)"/>
          <path d="M147,254C160,255 171,255 182,255L177,261C166,259 157,257 147,254Z" fill="url(#wingsGrad)"/>
          <path d="M329,219h17l8,8h-25z" fill="#EAF2F1"/>
        </g>
      </g>

      <text x="160" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#102F34">Adaptive Android Launcher Icon</text>
      <text x="160" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#526467">Configured in app/src/main/res/mipmap-anydpi-v26 with official vector layers:</text>
      <text x="160" y="105" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#F16B5A">ic_launcher_background.xml · ic_launcher_foreground.xml</text>
    </g>

    <!-- Persona & Marketplace Architecture Card -->
    <g transform="translate(0, 305)" filter="url(#cardShadow)">
      <rect width="640" height="155" rx="18" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1"/>

      <!-- Requester Persona Badge -->
      <g transform="translate(25, 25)">
        <rect width="280" height="105" rx="14" fill="#FFF8F5" stroke="#FFE2D9" stroke-width="1"/>
        <circle cx="35" cy="35" r="18" fill="#F16B5A"/>
        <text x="35" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">ط</text>
        <text x="65" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#102F34">Requester (طالب)</text>
        <text x="65" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#F16B5A">Active Orders · 3-Step Errand Wizard</text>
        <text x="20" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6B7E81">Order custom groceries, medicines &amp; bills with landmark guidance.</text>
      </g>

      <!-- Runner Persona Badge -->
      <g transform="translate(335, 25)">
        <rect width="280" height="105" rx="14" fill="#F0FAF5" stroke="#CEEFDF" stroke-width="1"/>
        <circle cx="35" cy="35" r="18" fill="#0F9F55"/>
        <text x="35" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">ك</text>
        <text x="65" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#102F34">Runner (كابتن)</text>
        <text x="65" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F9F55">Marketplace · Verification Gated</text>
        <text x="20" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6B7E81">Browse live community requests, accept jobs &amp; earn delivery fees.</text>
      </g>
    </g>

    <!-- Tech Stack Mini Badges -->
    <g transform="translate(0, 485)">
      <rect width="640" height="75" rx="14" fill="#FFFFFF" stroke="#E1EBE8" stroke-width="1"/>
      <text x="25" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#526467">ENGINEERING PILLARS</text>
      <text x="25" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#102F34">14 Gradle Modules · Jetpack Compose BOM 2025 · Clean MVVM · Dagger Hilt · Firebase Firestore</text>
    </g>
  </g>
</svg>
